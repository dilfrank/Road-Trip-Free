<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>自驾自由 2.0 · 演示</title><style>body{margin:0;background:#fdfaf7;color:#292522;font:18px/1.7 system-ui,sans-serif}main{max-width:1100px;margin:auto;padding:32px}h1{font-weight:500}nav{display:flex;gap:12px;flex-wrap:wrap;margin:24px 0}button,a{font:inherit;border:0;border-radius:24px;background:#ffe1d0;padding:12px 22px;color:#33251f;text-decoration:none}figure{margin:0;background:white;border-radius:24px;padding:24px;text-align:center}img{max-width:100%;height:65vh;object-fit:contain}figcaption{margin:16px 0}p{max-width:900px}video{width:100%;max-height:75vh;background:#fff}summary{cursor:pointer}</style><main><h1>自驾自由 2.0</h1><p>表达想法 → 填写条件 → 一次提交 → 三套方案对比</p><p>真实页面截图导览，可逐步查看或播放。当前模型与地图未接通，方案为待核实草案。</p><nav><button id="prev">上一步</button><button id="play">播放演示</button><button id="next">下一步</button><a href="/">体验应用</a></nav><figure><img id="frame" src="01-intent.jpg" alt="表达想法"><figcaption id="caption" aria-live="polite"></figcaption></figure><details><summary>播放 MP4 截图演示</summary><video controls preload="metadata" src="walkthrough.mp4"></video><p>20 秒截图导览，无配音；不是连续屏幕录制。</p></details></main><script>const scenes=[['01-intent.jpg','1 / 5 · 表达想法：可选感受、期待、顾虑、关系、意义、回忆和当地社区主题。'],['02-plan.jpg','2 / 5 · 填写出行条件：出发地、日期、天数与驾驶上限。'],['03-comparison.jpg','3 / 5 · 点击整理后直接生成三套方案；窄屏可横向滚动对比。'],['05-comparison-right.jpg','4 / 5 · 横向查看另外两套方案，逐项对照。'],['04-validation.jpg','5 / 5 · 对照驾驶、预算与取舍；未核实的数据明确显示待核实。']];let i=0,timer=null;const frame=document.getElementById('frame'),caption=document.getElementById('caption'),play=document.getElementById('play');function render(){frame.src=scenes[i][0];frame.alt=scenes[i][1];caption.textContent=scenes[i][1]}function stop(){clearInterval(timer);timer=null;play.textContent='播放演示'}document.getElementById('prev').onclick=()=>{stop();i=(i+4)%5;render()};document.getElementById('next').onclick=()=>{stop();i=(i+1)%5;render()};play.onclick=()=>{if(timer){stop();return}play.textContent='暂停';timer=setInterval(()=>{i=(i+1)%5;render()},4000)};render();</script></html>
